# 推 v* tag 触发：编内核（按 commit 缓存）→ 打包 arm64 / x64 .app → 签名/公证
# （secrets 齐备时）→ 建 GitHub Release 并上传 DMG。
#
# 需要的 repo secrets（缺则跳过对应步骤，产出 ad-hoc 签名的 DMG）：
#   MACOS_CERT_P12        Developer ID Application 证书导出的 .p12，base64 编码
#   MACOS_CERT_PASSWORD   .p12 密码
#   NOTARY_APPLE_ID       Apple ID（公证用）
#   NOTARY_TEAM_ID        团队 ID（10 位）
#   NOTARY_PASSWORD       该 Apple ID 的 app-specific password
name: release

# main 分支也触发：GitHub 缓存按 ref 隔离，tag 之间互不可见，只有 main 上的
# 缓存全局可读。main 只准备内核、helper 与 Swift release 产物；同一 commit 的 tag
# 直接复用这些产物，再并行组装两种架构，不在 main 上重复签名和制作 DMG。
on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

# 默认 GITHUB_TOKEN 是只读的；建 Release / 传资产需要 contents 写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ZIG_VERSION: 0.16.0
      GHOSTTY_REPO: isToThyMoon/ghostty
      GHOSTTY_REF: lightty-patches
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 打包脚本用 rev-list --count 加偏移生成 build number

      - name: Verify release toolchain
        id: toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION=$(xcrun --sdk macosx --show-sdk-version)
          XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ {print $3}')
          test "$XCODE_BUILD" = "17F113"
          test "$SDK_VERSION" = "26.5"
          echo "sdk=$SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "xcode=$XCODE_BUILD" >> "$GITHUB_OUTPUT"

      - name: Checkout ghostty kernel (lightty-patches)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GHOSTTY_REPO }}
          ref: ${{ env.GHOSTTY_REF }}
          path: vendor/ghostty

      - name: Resolve kernel commit (cache key)
        id: kernel
        run: echo "sha=$(git -C vendor/ghostty rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache GhosttyKit
        id: kernel-cache
        uses: actions/cache@v4
        with:
          # 必须覆盖打包脚本消费的全部内核产物（xcframework + 资源三件套），
          # 缺一个就会在缓存命中的 run 里打包失败（terminfo 缺失事故，v2 起修复）
          path: |
            vendor/ghostty/macos/GhosttyKit.xcframework
            vendor/ghostty/zig-out/share/ghostty
            vendor/ghostty/zig-out/share/terminfo
            vendor/ghostty/zig-out/share/locale
          # v3 隔离旧 runner 产物；工具链升级自动失效，不能回退到旧 key。
          key: ghosttykit-v3-macos26-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-sdk${{ steps.toolchain.outputs.sdk }}-zig${{ env.ZIG_VERSION }}-${{ steps.kernel.outputs.sha }}

      - name: Install zig
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build kernel
        if: steps.kernel-cache.outputs.cache-hit != 'true'
        run: |
          cd vendor/ghostty
          zig build -Demit-macos-app=false -Dsentry=false -Doptimize=ReleaseFast

      - name: Sync GhosttyKit into SwiftPM layout
        run: scripts/sync-ghosttykit.sh

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-v1-macos-${{ hashFiles('scripts/claude-session-helper/package-lock.json') }}

      # Swift 的增量缓存依赖源码 mtime；checkout 会刷新 mtime，跨 runner 恢复后仍会
      # 重编译。这里缓存打包真正消费的最终产物，并按 commit 精确命中。
      - name: Cache prepared release products
        id: release-products
        uses: actions/cache@v4
        with:
          path: |
            .build/apple/Products/Release/lightty
            .build/apple/Products/Release/lightty-hook
            .build/apple/Products/Release/lightty_lightty.bundle
            .build/apple/Products/Release/Sparkle.framework
            .build/claude-session-helper
          key: release-products-v1-macos26-${{ runner.arch }}-xcode${{ steps.toolchain.outputs.xcode }}-sdk${{ steps.toolchain.outputs.sdk }}-${{ hashFiles('Package.resolved', 'scripts/claude-session-helper/package-lock.json', 'scripts/prepare-claude-helper.mjs') }}-${{ github.sha }}

      - name: Prepare helper + Swift release products
        if: steps.release-products.outputs.cache-hit != 'true'
        run: |
          node scripts/prepare-claude-helper.mjs --all
          swift build -c release --arch arm64 --arch x86_64

      - name: Import Developer ID certificate
        if: github.ref_type == 'tag' && env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          rm cert.p12

      - name: Package app + DMG
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # helper 与 Swift release 已在上一步准备；两种架构只读这些产物，输出目录互不重叠。
          pids=()
          for flavor in arm64 x64; do
            (FLAVOR=$flavor MAKE_DMG=1 USE_PREBUILT=1 scripts/package-app.sh "$VERSION") &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          [ "$result" -eq 0 ]
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verify packaged SDK and deployment target
        if: github.ref_type == 'tag'
        run: |
          bash scripts/verify-release-sdk.sh dist/arm64/lightty.app/Contents/MacOS/lightty arm64
          bash scripts/verify-release-sdk.sh dist/x64/lightty.app/Contents/MacOS/lightty x86_64

      # 公证要排在 appcast 之前：stapler 会把票据写进 DMG，改动文件内容，
      # 先算好的 EdDSA 签名就对不上了，Sparkle 会拒绝安装。
      - name: Notarize + staple
        if: github.ref_type == 'tag' && env.HAS_NOTARY == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          for flavor in arm64 x64; do
            DMG="dist/lightty-$VERSION-$flavor.dmg"
            xcrun notarytool submit "$DMG" --wait \
              --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"
            xcrun stapler staple "$DMG"
          done

      - name: Generate appcasts with delta updates
        if: github.ref_type == 'tag'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          # 最后一个发布通用包、且自带「按架构改指更新源」逻辑（UpdateFeed）的版本。
          LEGACY_FEED_TAG: v0.14.0
        run: |
          set -euo pipefail
          PREFIX="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          pids=()
          for flavor in arm64 x64; do
            (echo "$SPARKLE_ED_PRIVATE_KEY" | scripts/build-appcast.sh \
              "$flavor" "dist/lightty-$VERSION-$flavor.dmg" "appcast-$flavor.xml" "$PREFIX") &
            pids+=("$!")
          done
          result=0
          for pid in "${pids[@]}"; do wait "$pid" || result=1; done
          [ "$result" -eq 0 ]
          # 冻结的 appcast.xml：分架构之前装好的 app，SUFeedURL 写死为
          # releases/latest/download/appcast.xml，`latest` 永远指向最新 Release，
          # 所以每次都要把它原样再传一份，否则老安装检查更新是 404、永远停在旧版。
          # 它只列 $LEGACY_FEED_TAG 的通用包（下载地址指向那个 Release，签名不变）；
          # 老安装先经它升到该版本，下次检查由 UpdateFeed 改指到单架构源。
          mkdir -p dist/feed-legacy
          gh release download "$LEGACY_FEED_TAG" --pattern appcast.xml --dir dist/feed-legacy
          grep -q "sparkle:edSignature" dist/feed-legacy/appcast.xml
          grep -q "/releases/download/$LEGACY_FEED_TAG/" dist/feed-legacy/appcast.xml
          echo "$PWD/dist/feed-legacy/appcast.xml" > dist/feed-legacy/upload.txt
          cat dist/feed-*/upload.txt > dist/upload.txt
          cat dist/upload.txt

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## 下载 / Download

          | 机器 | 下载 |
          |---|---|
          | Apple Silicon（M 系列） | [lightty-$VERSION-arm64.dmg](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/lightty-$VERSION-arm64.dmg) |
          | Intel | [lightty-$VERSION-x64.dmg](https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/lightty-$VERSION-x64.dmg) |

          已经装好的版本不用管这张表，应用内检查更新会自动取到对应的包，
          而且从这个版本起走增量更新，每次只下一两 MB。

          ## 安装 / Install

          应用已签名但未公证。首次打开若提示「无法验证开发者」：
          **系统设置 → 隐私与安全性 → 拉到底部 → 「仍要打开」**；
          或在终端执行 \`xattr -cr /Applications/lightty.app\` 后正常打开。

          The app is signed but not notarized. If Gatekeeper blocks the first
          launch: **System Settings → Privacy & Security → scroll down →
          "Open Anyway"**, or run \`xattr -cr /Applications/lightty.app\`.
          EOF
          # 两份整包 + 各自的增量包 + 两条单架构 feed + 冻结的 appcast.xml
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $(tr '\n' ' ' < dist/upload.txt)
